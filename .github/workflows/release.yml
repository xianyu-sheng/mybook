name: Build and publish Mybook

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mybook-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  DESKTOP_DIR: apps/desktop

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run typecheck

      - name: Unit tests
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npx vitest run

  build-linux:
    name: Linux installers
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - name: Build Linux packages
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run package:linux

      - name: Verify Linux package contents
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run verify:package -- linux

      - name: Create checksums
        working-directory: apps/desktop/release
        run: sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: mybook-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm ci

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Windows audio helper
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: pwsh
        run: |
          npm run build:platform
          if ($LASTEXITCODE -ne 0) { throw 'Windows audio helper build failed' }
          $helper = "native/windows-audio/publish/mybook-windows-audio.exe"
          if (-not (Test-Path $helper)) { throw "Windows audio helper was not built: $helper" }
          & $helper capture --inputs '[null]'
          if ($LASTEXITCODE -ne 2) { throw 'Windows audio helper accepted a null input' }
          & $helper capture --inputs '[]'
          if ($LASTEXITCODE -ne 2) { throw 'Windows audio helper accepted an empty input list' }
          Set-Service Audiosrv -StartupType Manual
          Start-Service Audiosrv
          & $helper list
          if ($LASTEXITCODE -ne 0) { throw "Windows audio helper device listing failed with exit code $LASTEXITCODE" }

      - name: Build Windows installer
        working-directory: ${{ env.DESKTOP_DIR }}
        run: npm run package:windows

      - name: Verify packaged Windows resources
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: pwsh
        run: |
          npm run verify:package -- win32
          if ($LASTEXITCODE -ne 0) { throw 'Windows package content verification failed' }
          $resources = 'release/win-unpacked/resources'
          $required = @(
            'speech/transcribe.py',
            'windows-audio/mybook-windows-audio.exe',
            'app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe',
            'app.asar.unpacked/node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $resources $file))) { throw "Packaged resource missing: $file" }
          }
          & "$resources/windows-audio/mybook-windows-audio.exe" list
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows audio helper could not run' }

      - name: Create checksums
        working-directory: ${{ env.DESKTOP_DIR }}
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' }
          if (-not $files) { throw 'No Windows release files were produced' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Path release/SHA256SUMS-windows.txt -Value $lines -Encoding utf8NoBOM

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mybook-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: mybook-*
          path: release
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "$RELEASE_TAG" = "v$version"

      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mybook $GITHUB_REF_NAME" \
            --generate-notes
